<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product Details | Target Food Co. S.A.L</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Product information, benefits, and available nutrition details from Target Food.">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/site.css">
  <script defer src="js/home.js"></script>
  <script defer src="js/productDetails.js"></script>
</head>
<body>
  <div class="page">
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="container topbar__row">
        <a class="brand" href="index.html#top">
          <img src="images/targetfoodlogo.png" alt="Target Food logo">
        </a>
        <nav class="nav" data-nav>
          <a href="index.html#home">Home</a>
          <a href="about.html">About</a>
          <a href="brands.html">Brands</a>
          <a href="products.html">Products</a>
          <a href="contact.html" class="btn btn--small btn--ghost btn--ghost--light">Contact</a>
        </nav>
        <button class="nav__toggle" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main>
      <section class="page-hero page-hero--compact" style="background-image:url('images/category-food-snacks.jpg')">
        <div class="container page-hero__inner">
          <span class="breadcrumb">Home · Products · Details</span>
          <h1 id="product-page-title">Product details</h1>
          <p>Review the product overview, benefits, and available nutrition information.</p>
        </div>
      </section>

      <section class="section">
        <div class="container" id="product-details-inner" aria-live="polite">
          <div class="loader-container" id="product-details-loader">
            <div class="loader" aria-label="Loading product details"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__row">
        <div>&copy; <span id="year"></span> Target Food Co. S.A.L</div>
        <nav>
          <a href="index.html#home">Home</a>
          <a href="about.html">About</a>
          <a href="brands.html">Brands</a>
          <a href="products.html">Products</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </footer>
  </div>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
